<script>
// 親専用操作：A=左、D=右、S=落下、W=ゴミを捨てる
// 元の九九リスの ugokasu() にキーコードを渡す。
function parentUgokasu(e) {
    const key = (e.key || '').toLowerCase();
    const map = { a: 37, d: 39, s: 40, w: 38 };
    if (map[key]) {
        e.preventDefault();
        ugokasu({ keyCode: map[key], which: map[key] });
    } else if ([37,38,39,40].includes(e.keyCode)) {
        // 矢印キーも従来どおり使えるようにする
        ugokasu(e);
    }
}
</script>
<script>
// 親専用操作
// A=左、D=右、S=落下、W=ゴミを捨てる。
// battleページから postMessage で届いたキーもここで処理する。

function parentUgokasu(e) {
    const key = (e.key || '').toLowerCase();
    const map = { a: 37, d: 39, s: 40, w: 38 };

    if (map[key]) {
        e.preventDefault();
        ugokasu({ keyCode: map[key], which: map[key] });
    } else if ([37, 38, 39, 40].includes(e.keyCode)) {
        ugokasu(e);
    }
}

// 子側がSTARTされてフォーカスを持っていても、
// battleページから親iframeへ送られたキーを直接受け取る。
window.addEventListener("message", function(event) {
    const data = event.data || {};

    if (data.type !== "parent-key") return;

    const key = String(data.key || "").toLowerCase();
    if (!["a", "d", "s", "w"].includes(key)) return;

    parentUgokasu({
        key: key,
        keyCode: { a: 37, d: 39, s: 40, w: 38 }[key],
        which: { a: 37, d: 39, s: 40, w: 38 }[key]
    });
});
</script>

<script>
window.addEventListener("message", function(e){
 const d=e.data||{};
 if(d.type!=="battle-parent-key") return;
 const map={a:37,d:39,s:40,w:38};
 const code=map[String(d.key||"").toLowerCase()];
 if(!code || typeof ugokasu!=="function") return;
 ugokasu({keyCode:code,which:code,key:String(d.key).toLowerCase()});
});
</script>

        if (typeof gamekaishi === "function") gamekaishi();
    }
});
